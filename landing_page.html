<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        margin: 0%;
    }

    .background {
        background-image: url("porche.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        display: flex;
        flex-direction: column;
        align-items: center;

        width: 100%;
        min-height: 100vh;
        position: fixed;
        top: 0;
        left: 0;

        z-index: 10;

        transition: transform 0.9s ease-in-out;

    }
    .background.swipe-up {
            transform: translateY(-100%);
        }

    h1 {
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        font-weight: 800;
        font-size: 3.5rem;
        color: rgba(66, 5, 141,0.6);
        text-shadow: 2px 0px 5px rgb(88, 78, 78);
    }

    h2 {
        display: flex;
        font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        margin-top: -30px;
        color: rgba(66, 5, 141);
        font-weight: 500;
        text-shadow: 2px 0px 5px rgb(88, 78, 78)
    }

    #head {
        margin-top: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    button {
        height: 50px;
        width: 150px;
        border-radius: 50%;
        border-color: bisque;
        background-color: rgb(214, 203, 191);
        color: rgba(66, 5, 141);
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    b {
        color: rgba(211, 12, 121);
    }

    /* .glass-text {
        font-family: 'Georgia', serif;
        font-size: 3rem;
        font-weight: bold;
        margin: 0;


        background: linear-gradient(90deg, #f3c653 0%, #76c893 35%, #52b69a 65%, #00b4d8 100%);


        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        /* Optional soft glow to enhance the glassy look */
    /* filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
    } */
</style>

<body>
    <div class="background" id="welcome">
        <div id="head">
            <h1>Welcome To <b>Car Saathi</b></h1>
            <h2>Press Open Now Button To Open</h2>
            <button id="openBtn">Open Now</button>
        </div>
    </div>

</body>
<script>
        const openBtn = document.getElementById("openBtn");
        const welcome = document.getElementById("welcome");

        openBtn.addEventListener("click", () => {
            welcome.classList.add("swipe-up");
        });
    </script>
</html>
